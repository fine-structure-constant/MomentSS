server {
    listen 127.0.0.1:18080;
    server_name momentss.renschekhe.site;

    root /home/rocky/data/service/momentss/current;
    index index.html;

    # Use existing log directories; only this site's traffic uses these files.
    access_log /var/log/nginx/momentss-access.log;
    error_log /var/log/nginx/momentss-error.log;

    location = /version.json {
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }

    location ~ /\. {
        deny all;
    }
}
